name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        working-directory: web-ui
        run: npm ci

      - name: Run unit tests
        working-directory: web-ui
        run: npm run test:unit -- --run

      - name: Build frontend
        working-directory: web-ui
        run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --locked

  windows-static:
    name: Windows static files
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test static routes
        run: cargo test --locked --test http_tests static_

      - name: Test Windows file opening
        run: cargo test --locked --test shared_primitives_tests windows_safe_open_

      - name: Build Windows binary
        run: cargo build --locked --release --bin dst-admin-rust

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: dst-admin-rust-windows
          path: target/release/dst-admin-rust.exe
