name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if (-not $version -or $version -eq '${{ github.ref_name }}') {
            throw 'Release tags must use v<version>.'
          fi
          "version=$version" >> $env:GITHUB_OUTPUT
          "windows_archive=dst-panel.$version-windows.zip" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build frontend
        working-directory: web-ui
        run: npm ci && npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Validate package versions
        shell: pwsh
        run: |
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'dst-admin-rust' | Select-Object -ExpandProperty version
          $frontendVersion = (Get-Content web-ui/package.json -Raw | ConvertFrom-Json).version
          if ($cargoVersion -ne '${{ steps.release.outputs.version }}' -or
              $frontendVersion -ne '${{ steps.release.outputs.version }}') {
            throw "Package versions must match tag ${{ github.ref_name }}"
          }

      - name: Run Windows tests
        run: cargo test --locked

      - name: Build Windows binary
        run: cargo build --locked --release --bin dst-admin-rust

      - name: Package Windows release
        shell: pwsh
        run: |
          $packageDir = 'dist/release/dst-panel.${{ steps.release.outputs.version }}-windows'
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item target/release/dst-admin-rust.exe,config.yml $packageDir
          Copy-Item static (Join-Path $packageDir 'static') -Recurse
          Copy-Item web-ui/dist (Join-Path $packageDir 'dist') -Recurse
          Copy-Item docs/WINDOWS.md (Join-Path $packageDir 'WINDOWS.md')
          Compress-Archive -Path $packageDir -DestinationPath 'dist/release/${{ steps.release.outputs.windows_archive }}'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/${{ steps.release.outputs.windows_archive }}
